[project]
name = "modelctl-venv-vllm"
version = "0.1.0"
description = "vLLM 引擎专属虚拟环境（由 modelctl env setup 管理）"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.27,<0.28",
]

[tool.uv]
# 注意：本文件一旦声明 [tool.uv]，uv 就不再向上查找项目根 uv.toml，
# 因此根 uv.toml 里的阿里 default index 对本子项目不生效，必须在此重复声明。
[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# torch cu13 explicit index（从项目根 uv.toml 迁移，保持子项目自包含、uv sync 可复现）
[[tool.uv.index]]
name = "pytorch-cu13"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# 官方 PyPI 兜底（与根 uv.toml 对齐）：阿里镜像缺失的包按声明顺序回退查询。
[[tool.uv.index]]
url = "https://pypi.org/simple/"
