[project]
name = "modelctl-venv-vllm"
version = "0.1.0"
description = "vLLM 引擎专属虚拟环境（由 modelctl env setup 管理）"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.27,<0.28",
]

[tool.uv]
# torch cu13 explicit index（从项目根 uv.toml 迁移，保持子项目自包含、uv sync 可复现）
[[tool.uv.index]]
name = "pytorch-cu13"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
