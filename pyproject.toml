[project]
name = "modelctl"
version = "0.3.0"
description = "多模型部署启动器（llamacpp / ollama / vllm / sglang）"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
modelscope = ["modelscope>=1.0"]
gateway = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
modelctl = "modelctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["modelctl"]
