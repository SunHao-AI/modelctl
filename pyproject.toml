[project]
name = "modelctl"
version = "0.3.0"
description = "多模型部署启动器（llamacpp / ollama / vllm / sglang）"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "loguru>=0.7",
    # zoneinfo 在 Windows 无系统 tz 库，需 tzdata 才能解析 IANA 时区名（core/timezone.py）；
    # Linux/macOS 自带 /usr/share/zoneinfo，不必额外安装。
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# gateway 的依赖（fastapi/uvicorn/httpx）已迁出主 lockfile，移至独立子项目 `gateway/`，
# `modelctl gateway start` 时自动经 `uv sync --project gateway` 创建专属 venv；
# 这样主 `uv sync` 不会再清理 gateway 相关包，二者可独立演进/审计。
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "websockets>=12",
]

[project.scripts]
modelctl = "modelctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["modelctl"]
