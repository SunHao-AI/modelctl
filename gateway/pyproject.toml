[project]
name = "modelctl-venv-gateway"
version = "0.1.0"
description = "modelctl LLM 网关独立虚拟环境（由 modelctl env setup gateway / modelctl gateway start 维护）"
requires-python = ">=3.12"
# 主包 modelctl 不在此写 URL/路径——靠下方 [tool.uv.sources] 指向 ../(项目根);
# hatchling 构建后,modelctl.core.gateway 直接命中 ../src/modelctl/。
# 注意:`modelctl[dev] @ file:///../` 这种 inline URL 会被 uv 拒绝(path 无法规范化)。
dependencies = [
    "modelctl[dev]",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    # 账号体系（core/accounts）专用：bcrypt 做账号密码哈希，PyJWT 给 webui 账号面板签发 JWT。
    # 只落在这里、不落主包 pyproject：accounts 代码只在 gateway/webui 进程内跑（同一 venv），
    # 主包 CLI 只在包入口读开关，故 core/accounts/* 对二者一律延迟导入。
    "bcrypt>=4.0",
    "PyJWT>=2.8",
]

[tool.uv.sources]
# 把 "modelctl" 要求替换为本地 path 源(相对本 pyproject.toml 的 ../ 即项目根);
# 主包自带 [project.optional-dependencies],dev extra 随 path 源传递安装。
modelctl = { path = ".." }

[tool.uv]
# gateway 必须自带 index 声明：上方 [tool.uv.sources] 已隐式创建 tool.uv 表，
# uv 一旦发现 tool.uv 存在就停止向上读根 uv.toml，根配置的镜像优先级传不进来。
# 注意不要写 default = true —— uv 会把 default index 移到优先级列表**末尾**
# （最低优先级），详见 docs/known-pitfalls/build/uv-index-and-download.md。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
