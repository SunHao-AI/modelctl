group: qwen3.8
port: 8130
api_key: ${API_KEY}

lmdeploy:
  # bind_host：服务绑定地址（安全加固，2026-09-08，所有引擎统一默认）
  # 默认 127.0.0.1 仅回环监听：外部（含 AI Agent / 其他内网主机）无法直连引擎端口，
  # 从而堵住绕过网关鉴权/账号/多 Key/token 限速/审计的“第二入口”。
  # 确需对外暴露时改为 0.0.0.0，并配合防火墙/白名单限制来源（非默认，风险自担）。
  bind_host: 127.0.0.1
  model: /raid5/sh/model-hf/Qwen/Qwen3.8-27B
  tensor_parallel_size: 1
  session_len: 32768
  cache_max_entry_count: 0.8
  quant_policy: 4
  extra_args: "--enable-prefix-caching"

usage:
  price_in: 0.5
  price_out: 1.0
