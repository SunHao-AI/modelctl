# llamacpp/qwen3.8.yaml —— Qwen3.8-27B（llama.cpp 引擎）
# 学习要点：Qwen 无 DSpark 草稿，dspark 必须 off；其余字段与 DeepSeek 配置一致。
group: qwen3.8
# alias：短名别名，网关/nginx 路由可用 `qwen3.8` 指代本模型（如 URL /210/llm/qwen3.8/v1）
alias: qwen3.8
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang / unsloth）
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 18889
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

llamacpp:
  # model：本地 GGUF 模型路径（可选，留空即可）。
  # 为空/不存在时按 download 段下载到 $MODEL_ROOT/<仓库名> 后直接使用；
  # 落地路径由 MODEL_ROOT + modelscope_id 确定，本文件不会被改写（保持 git 干净）
  model: ""
  # download：模型不存在时的自动下载配置（ModelScope，GGUF 格式）
  download:
    # modelscope_id：ModelScope 仓库 ID
    modelscope_id: unsloth/Qwen3.8-27B-GGUF
    # quant：仓库内实际量化名（需与 GGUF 文件名量化段一致），如 Q4_K_M / Q5_K_M / Q8_0
    quant: Q4_K_M
  # parallel：并发槽位数（同时处理多少请求），显存占用随其增长
  parallel: 4
  # ctx_size：单槽（每并发请求）完整可用的上下文；留空 = 1,048,576（1M）
  # 注意：llama-server 的 --ctx-size 是总量，实际启动总量 = ctx_size × parallel
  #（本配置 262144 × 4 = 1048576，每个并发请求都能用满 262144，与其他引擎语义一致）
  ctx_size: 262144
  # reasoning：是否输出推理过程内容（on/off）
  reasoning: on
  # reasoning_format：推理内容格式（deepseek / none 等）
  reasoning_format: deepseek
  # dspark：DSpark 投机解码开关。Qwen 无 dspark 草稿，必须 off
  dspark: off
  # vision：视觉能力开关（on/off）。Qwen3.8 为原生 VLM，开启后启动时传入 --mmproj，
  # 否则含图请求会被 llama-server 拒绝（500 "image input is not supported"）
  vision: on
  # mmproj：视觉投影文件路径（可选）。留空 = 自动在模型目录查找 *mmproj*.gguf；
  # 找不到且配置了 download 段时，从同一 ModelScope 仓库补下（约 900MB）
  mmproj: ""
  # cache_type_k / cache_type_v：KV cache 量化类型，降低显存占用（q8_0/f16 等）
  cache_type_k: q8_0
  cache_type_v: q8_0
  # gpu_count：实际参与推理的 GPU 数量，决定 --tensor-split 分片
  gpu_count: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；与 gpu_count 二选一，配置后覆盖 gpu_count
  # 示例：gpu_list: "0,1,2,3,4,5,6,7"
  # fit：llama.cpp 显存适配策略（on/off）
  fit: off
  # 采样参数（可选）：缓解重复输出/贪心采样。llama.cpp 默认 repeat-penalty=1.0（无重复惩罚），
  # 缺省不传时保持引擎默认行为
  repeat_penalty: 1.1 # 重复惩罚（1.0=关闭；1.05~1.15 可有效中断循环）
  repeat_last_n: 256 # 对最后 N 个 token 施加重复惩罚
  temperature: 0.6 # 采样温度（0=贪心，易重复；建议 0.6~0.8）
  top_p: 0.95 # 核采样阈值
  top_k: 40 # 候选 token 数

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 0.5
  # price_out：每千输出 token 计价（元）
  price_out: 1.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
