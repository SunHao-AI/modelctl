# llamacpp/qwen3.8-flash-next.yaml —— Qwen3.8-Flash-Next（llama.cpp 引擎，GGUF）
# 学习要点：llama.cpp 是统一的 GGUF 执行基座，多种推理栈（本机启动、云端推理、Ollama、Unsloth）共享
#
# 【重要】本模型必须使用 llama.cpp PR #27793（qwen4exp 分支）才能支持：
#   主线 llama.cpp 尚未识别 Qwen3.8-Flash-Next 的架构（qwen4exp），直接启动会报
#   "error loading model: unknown model architecture: 'qwen4exp'"。
#
# 【推荐：独立副本构建，不动主线 /raid5/sh/code/llama.cpp】
#   在单独目录生成一份 PR 分支副本并编译（GIT 远程以 pull/27793/head 为准，PR 后续更新也能拉到）：
#     git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /raid5/sh/code/llama.cpp-qwen38-flash-next
#     cd /raid5/sh/code/llama.cpp-qwen38-flash-next
#     git fetch --depth 1 origin pull/27793/head:qwen4exp-flash-next
#     git checkout qwen4exp-flash-next
#     cmake -B build -DGGML_CUDA=ON -DGGML_AVX512=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=89
#     cmake --build build --config Release -j 4
#   【务必指定 CUDA 算力】RTX 5880 为 Ada 架构(sm_89)，必须带 -DCMAKE_CUDA_ARCHITECTURES=89，
#   否则编译出的内核不含 sm_89，启动模型时报：
#     "CUDA error: no kernel image is available for execution on the device"
#   若已用未指定算力的旧 build 目录编过，请 rm -rf build 后重新执行上面两条 cmake 命令。
#   然后把下方 llamacpp.source_dir 指向该副本目录即可。
#   modelctl 源码目录解析优先级：source_dir → 环境变量 LLAMACPP_SOURCE_DIR → 默认主线。
#   指定 source_dir 后，若 <副本>/build/bin/llama-server 已存在则直接使用（不再编译）；
#   若缺失，会用该副本源码自动补编译（同样是 PR 分支源码，不会用主线）。
#
# 【无 DSpark】本模型 MTP 头走 llama.cpp 的 EAGLE3 / 内置 MTP 路径，而非 dspark 拖影
# 投机（与 Qwen3.8 系列一致）；dspark 必须 off
#
# 【多模态】Flash-Next 为原生 VLM（图+文），相当于 Qwen3.8 的新一代；
#   mmproj 文件需另行从 unsloth 仓库获取。当前仓库可能尚未同步，如需图输入请手动放置
#
# 【采样参数】混合思考模型，官方推荐（Unsloth 文档）：
#   思考模式：T=1.0, top_p=0.95, top_k=20
#   非思考模式：T=0.7, top_p=0.80, top_k=20, presence_penalty=1.5
#   温度/top_p 同时配置时，由 llama.cpp 优先级决定
group: qwen3.8-flash-next
# alias：短名别名，网关/nginx 路由可用 `qwen3.8-flash-next` 指代本模型
alias: qwen3.8-flash-next
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang / unsloth）
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 18909
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

llamacpp:
  # source_dir：llama.cpp 源码目录（建议填上面头部注释里 PR 副本的绝对路径）。
  #   留空=回退环境变量 LLAMACPP_SOURCE_DIR，再回退默认主线；point 到已编译副本时无需再动构建。
  source_dir: /raid5/sh/code/llama.cpp-qwen38-flash-next
  # model：本地 GGUF 模型路径。为空/不存在时通过 download 段自动下载；
  # 下载成功后此字段会被覆盖为本地绝对路径（原文件备份 .yaml.bak）
  model: ""
  # download：模型不存在时的自动下载配置（ModelScope，GGUF 格式）
  download:
    # modelscope_id：ModelScope 仓库 ID（unsloth 生成的 GGUF）
    modelscope_id: unsloth/Qwen3.8-Flash-Next-GGUF
    # quant：仓库内实际量化名（需与 GGUF 文件名量化段一致），如 Q4_K_XL / Q3_K_XL / Q2_K_XL
    # 111GB 量化下 8×RTX 5880（48GB/卡，共 384GB）完全装得下
    quant: Q4_K_XL
  # parallel：并发槽位数（同时处理多少请求），显存占用随其增长
  parallel: 1
  # ctx_size：单槽（每并发请求）完整可用的上下文；留空 = 1,048,576（1M）
  # 注意：llama-server 的 --ctx-size 是总量，实际启动总量 = ctx_size × parallel
  ctx_size: 65536
  # reasoning：是否输出推理过程内容（on/off）
  reasoning: on
  # reasoning_format：推理内容格式（deepseek / qwen3 / none 等）
  # 本模型为 Qwen 系列，推理块解析与 qwen3.8 一致（DeepSeek 兼容的 </think> 标签）
  reasoning_format: deepseek
  # dspark：DSpark 投机解码开关。本模型 MTP 头走 llama.cpp 的 EAGLE3 路径，
  # 而非 dspark 拖影，必须 off
  dspark: off
  # vision：视觉能力开关（on/off）。Flash-Next 为原生 VLM，开启后启动时传入 --mmproj。
  # 但 mmproj 可能尚未同步到 unsloth GGUF 仓库，未放好 mmproj 文件时保持 off 更安全；
  # 等 mmproj 同步后再切 on
  vision: off
  # mmproj：视觉投影文件路径（可选）。留空 = 自动在模型目录查找 *mmproj*.gguf；
  # 找不到且配置了 download 段时，从同一 ModelScope 仓库补下
  mmproj: ""
  # cache_type_k / cache_type_v：KV cache 量化类型，降低显存占用（q8_0/f16 等）
  cache_type_k: q8_0
  cache_type_v: q8_0
  # gpu_count：实际参与推理的 GPU 数量，决定 --tensor-split 分片
  # 8×RTX 5880，Q4_K_XL（111GB）走 tensor-split 均匀切 8 卡
  gpu_count: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；与 gpu_count 二选一，配置后覆盖 gpu_count
  # 示例：gpu_list: "0,1,2,3,4,5,6,7"
  # fit：llama.cpp 显存适配策略（on/off）
  fit: off
  # 采样参数：缓解重复输出/贪心采样。llama.cpp 默认 repeat-penalty=1.0（无重复惩罚），
  # 混合推理模型易循环输出，故显式配置
  repeat_penalty: 1.1 # 重复惩罚（1.0=关闭；1.05~1.15 可有效中断循环）
  repeat_last_n: 256 # 对最后 N 个 token 施加重复惩罚
  temperature: 0.7 # 采样温度（思考模式下建议 1.0；Instruct 模式 0.7）
  top_p: 0.8 # 核采样阈值（Instruct 模式 0.8；思考模式 0.95）
  top_k: 20 # 候选 token 数（与官方推荐一致）

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 3.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
