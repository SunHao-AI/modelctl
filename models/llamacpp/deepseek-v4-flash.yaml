# llamacpp/deepseek-v4-flash.yaml —— DeepSeek-V4-Flash-0731（llama.cpp 引擎）
# 学习要点：llama.cpp 引擎通过 GGUF 分片 + DSpark 投机解码运行，适合单机多卡。
# name：CLI 标识符，`modelctl start deepseek-v4-flash-llamacpp` 使用；全局唯一
name: deepseek-v4-flash-llamacpp
group: deepseek-v4-flash
# alias：短名别名，网关/nginx 路由可用 `deepseek-v4-flash` 指代本模型（如 URL /210/llm/deepseek-v4-flash/v1）
alias: deepseek-v4-flash
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang / unsloth）
engine: llamacpp
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 18888
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

llamacpp:
  # model：本地 GGUF 模型路径（首个分片）。为空/不存在时通过 download 段自动下载；
  # 下载成功后此字段会被自动覆盖为本地绝对路径（原文件备份为 .yaml.bak）
  model: ""
  # draft：DSpark 草稿模型路径；留空自动在模型同目录发现 dspark*.gguf
  draft: ""
  # parallel：并发槽位数（同时处理多少请求），显存占用随其增长
  parallel: 2
  # ctx_size：单槽（每并发请求）完整可用的上下文；留空 = 1,048,576（1M）
  # 注意：llama-server 的 --ctx-size 是总量，实际启动总量 = ctx_size × parallel
  #（留空时每槽 1M；与其他引擎的 context_length/max_model_len 语义一致）
  ctx_size: ""
  # reasoning：是否输出推理过程内容（on/off）
  reasoning: on
  # reasoning_format：推理内容格式（deepseek / none 等）
  reasoning_format: deepseek
  # dspark：DSpark 投机解码开关（on/off），仅 DeepSeek 系列模型可用
  dspark: on
  # spec_type：投机解码类型（draft-dspark 等）
  spec_type: draft-dspark
  # spec_draft_n_max：每次投机最多预测的 token 数
  spec_draft_n_max: 3
  # n_gpu_layers_draft：草稿模型卸载到 GPU 的层数（999 = 全部）
  n_gpu_layers_draft: 999
  # cache_type_k / cache_type_v：KV cache 量化类型，降低显存占用（q8_0/f16 等）
  cache_type_k: q8_0
  cache_type_v: q8_0
  # gpu_count：实际参与推理的 GPU 数量，决定 --tensor-split 分片
  gpu_count: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；与 gpu_count 二选一，配置后覆盖 gpu_count
  # 示例：gpu_list: "0,1,2,3,4,5,6,7"
  # fit：llama.cpp 显存适配策略（on/off）
  fit: off
  # 采样参数（可选）：缓解重复输出/贪心采样。llama.cpp 默认 repeat-penalty=1.0（无重复惩罚），
  # DeepSeek 推理/工具调用场景易循环输出；缺省不传时保持引擎默认行为
  repeat_penalty: 1.1 # 重复惩罚（1.0=关闭；1.05~1.15 可有效中断循环）
  repeat_last_n: 256 # 对最后 N 个 token 施加重复惩罚
  temperature: 0.6 # 采样温度（0=贪心，易重复；建议 0.6~0.8）
  top_p: 0.95 # 核采样阈值
  top_k: 40 # 候选 token 数
  # stops: ['<｜DSML｜tool_calls']   # 可选：额外停止序列（会截断工具调用，谨慎使用）
  # download：模型不存在时的自动下载配置（ModelScope，GGUF 格式）
  download:
    # modelscope_id：ModelScope 仓库 ID
    modelscope_id: unsloth/DeepSeek-V4-Flash-0731-GGUF
    # quant：仓库内实际量化名（需与 GGUF 文件名量化段一致）
    quant: UD-Q8_K_XL

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
