# llamacpp/qwen3-coder.yaml —— Qwen3-Coder-480B-A35B（llama.cpp 引擎）
# 学习要点：480B MoE（约 35B active），Q4_K_M 权重约 290GB，占满 8×RTX 5880（共 384GB）。
# 无 vllm/sglang 变体原因：官方 recipe（recipes.vllm.ai）显示 BF16 约 1152GB、FP8 约 576GB，
# 均超出本机总显存；NVFP4 288GB 虽可装入但需 Blackwell（sm120）原生支持，RTX 5880（Ada, sm89）不可用，
# 只能走 GGUF 路线。
# name：CLI 标识符，`modelctl start qwen3-coder-llamacpp` 使用；全局唯一
name: qwen3-coder-llamacpp
# alias：短名别名，网关/nginx 路由可用 `qwen3-coder` 指代本模型（如 URL /210/llm/qwen3-coder/v1）
alias: qwen3-coder
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang / unsloth）
engine: llamacpp
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 18890
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

llamacpp:
  # model：本地 GGUF 模型路径（首个分片）。为空/不存在时通过 download 段自动下载；
  # 下载成功后此字段会被自动覆盖为本地绝对路径（原文件备份为 .yaml.bak）
  model: ""
  # parallel：并发槽位数（同时处理多少请求），显存占用随其增长
  parallel: 2
  # ctx_size：单槽（每并发请求）完整可用的上下文；留空 = 1,048,576（1M）
  # 注意：llama-server 的 --ctx-size 是总量，实际启动总量 = ctx_size × parallel
  # 本模型权重约 290GB，KV cache 仅剩约 90GB 预算，故设 32K/槽（总 64K）；仍 OOM 时继续下调
  ctx_size: 32768
  # reasoning：是否输出推理过程内容（on/off）
  reasoning: on
  # reasoning_format：推理内容格式（deepseek / none 等）
  reasoning_format: deepseek
  # dspark：DSpark 投机解码开关。Qwen 无 dspark 草稿，必须 off
  dspark: off
  # cache_type_k / cache_type_v：KV cache 量化类型，降低显存占用（q8_0/f16 等）
  cache_type_k: q8_0
  cache_type_v: q8_0
  # gpu_count：实际参与推理的 GPU 数量，决定 --tensor-split 分片（本机 8 卡全用）
  gpu_count: 8
  # fit：llama.cpp 显存适配策略（on/off）
  fit: off
  # 采样参数（可选）：缓解重复输出/贪心采样。llama.cpp 默认 repeat-penalty=1.0（无重复惩罚），
  # 缺省不传时保持引擎默认行为
  repeat_penalty: 1.1      # 重复惩罚（1.0=关闭；1.05~1.15 可有效中断循环）
  repeat_last_n: 256       # 对最后 N 个 token 施加重复惩罚
  temperature: 0.6         # 采样温度（0=贪心，易重复；建议 0.6~0.8）
  top_p: 0.95              # 核采样阈值
  top_k: 40                # 候选 token 数
  # download：模型不存在时的自动下载配置（ModelScope，GGUF 格式）
  # 注意：仓库 ID 与量化名以 ModelScope 实际可用为准，启动前请核对
  download:
    # modelscope_id：ModelScope 仓库 ID
    modelscope_id: unsloth/Qwen3-Coder-480B-A35B-GGUF
    # quant：仓库内实际量化名（需与 GGUF 文件名量化段一致）
    quant: Q4_K_M

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
