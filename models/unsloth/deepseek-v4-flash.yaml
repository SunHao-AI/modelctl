# unsloth/deepseek-v4-flash.yaml —— DeepSeek-V4-Flash-Vision-Exp（Unsloth 引擎，无头 API）
# 学习要点：Unsloth 无头推理（unsloth studio run --api-only）支持 GGUF 动态量化；API key 运行时自动生成并打印到启动日志。
# 注意：本模型为多模态（图+文），但 unsloth 引擎不支持 --mmproj 视觉投影，仅能提供文本推理；
# 若需图片输入请改用 llamacpp / vllm 引擎的同名配置。
group: deepseek-v4-flash
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/v1/models）
port: 8001
# api_key：仅兜底（上游实际使用 unsloth 每次启动自动生成的 key，见启动成功后打印的提示）
api_key: ${UNSLOTH_API_KEY}

unsloth:
  # model：HF 模型 ID 或本地 GGUF 路径；留空则通过 download 段自动下载
  # bind_host：服务绑定地址（安全加固，2026-09-08，所有引擎统一默认）
  # 默认 127.0.0.1 仅回环监听：外部（含 AI Agent / 其他内网主机）无法直连引擎端口，
  # 从而堵住绕过网关鉴权/账号/多 Key/token 限速/审计的“第二入口”。
  # 确需对外暴露时改为 0.0.0.0，并配合防火墙/白名单限制来源（非默认，风险自担）。
  bind_host: 127.0.0.1
  model: unsloth/DeepSeek-V4-Flash-Vision-Exp-GGUF
  # gguf_variant：Unsloth 动态量化后缀；model 为本地路径时忽略
  # UD-Q8_K_XL 共 5 分片约 162GB；另有 UD-Q4_K_XL(205GB/5片)、UD-IQ2_XXS(91GB) 等可选
  gguf_variant: UD-Q8_K_XL
  # context_length：请求的上下文长度
  # 注意：单请求完整可用（与并发无关）；KV 显存 ≈ 并发 × context_length
  context_length: 32768
  # tensor_parallel：多卡 GGUF tensor-parallel 加载（需至少 2 块 GPU）
  tensor_parallel: true
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；tensor_parallel 开启时需至少 2 块
  # 示例：gpu_list: "0,1,2,3"
  # load_in_4bit：非 GGUF HF 模型的 4bit 加载
  load_in_4bit: false
  # Web 管理控制台（modelctl ui start）：监听 LAN 地址供 nginx/SSH 隧道转发访问；
  # allow_from 为允许直连 UI 端口的来源 IP（启动时自动添加对应 ufw 规则）
  ui:
    port: 8888
    allow_from: [192.168.77.202]
  # download：ModelScope 自动下载配置（model 不存在本地路径时触发）
  download:
    # modelscope_id：ModelScope 仓库 ID（GGUF 格式）
    modelscope_id: unsloth/DeepSeek-V4-Flash-Vision-Exp-GGUF
    # quant：仓库内实际量化名
    quant: UD-Q8_K_XL
  # extra_args：透传其他 unsloth 参数
  extra_args: ""

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
