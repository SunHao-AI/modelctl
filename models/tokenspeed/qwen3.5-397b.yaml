group: qwen3.5-397b
port: 8150
api_key: ${API_KEY}

tokenspeed:
  # bind_host：服务绑定地址（安全加固，2026-09-08，所有引擎统一默认）
  # 默认 127.0.0.1 仅回环监听：外部（含 AI Agent / 其他内网主机）无法直连引擎端口，
  # 从而堵住绕过网关鉴权/账号/多 Key/token 限速/审计的“第二入口”。
  # 确需对外暴露时改为 0.0.0.0，并配合防火墙/白名单限制来源（非默认，风险自担）。
  bind_host: 127.0.0.1
  model: Qwen/Qwen3.5-397B-A17B
  tensor_parallel_size: 8
  max_model_len: 131072
  docker_image: lightseekorg/tokenspeed:latest
  download:
    modelscope_id: Qwen/Qwen3.5-397B-A17B
  extra_args: "--enable-prefix-caching"

usage:
  price_in: 1.0
  price_out: 3.0
