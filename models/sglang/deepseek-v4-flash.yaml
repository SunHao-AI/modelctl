# sglang/deepseek-v4-flash.yaml —— DeepSeek-V4-Flash（SGLang 引擎，HuggingFace 原始权重）
# 学习要点：SGLang 与 vLLM 类似使用 HF 格式权重，通过 --tp 张量并行，适合高吞吐在线服务。
# name：CLI 标识符，`modelctl start deepseek-v4-flash-sglang` 使用；全局唯一
name: deepseek-v4-flash-sglang
group: deepseek-v4-flash
# engine：引擎类型，决定启动命令与参数映射（llamacpp / ollama / vllm / sglang / unsloth）
engine: sglang
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8200
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

sglang:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/不存在时通过 download 段从 ModelScope 下载并写回本地路径。
  # 请替换为实际可用的 HF 模型 ID，如 deepseek-ai/DeepSeek-V4-Flash-0731
  model: deepseek-ai/DeepSeek-V4-Flash-0731
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式）
    modelscope_id: deepseek-ai/DeepSeek-V4-Flash-0731
  # tensor_parallel_size：张量并行 GPU 数（--tp，不得超过实际 GPU 数）
  tensor_parallel_size: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；配置后长度必须等于 tensor_parallel_size
  # 示例：gpu_list: "0,1,2,3,4,5,6,7"
  # context_length：最大上下文长度（token）
  # 注意：单序列完整可用（与并发无关）；KV 显存 ≈ 并发 × context_length
  context_length: 131072
  # mem_fraction_static：静态显存分配比例（0~1），预留 KV cache 空间
  mem_fraction_static: 0.9
  # extra_args：透传给 `sglang.launch_server` 的额外参数（空格分隔，按 shlex 拆分）
  # 附录 A.2：显式启用 FP8 权重量化 + FP8 KV cache（Ada CC≥8.9 原生支持，精度损失 <1%）
  # 若引擎不支持权重 FP8，回退为仅保留 "--kv-cache-dtype fp8"
  extra_args: "--quantization fp8 --kv-cache-dtype fp8"

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
