# aphrodite/qwen2.5-1.5b.yaml —— Qwen2.5-1.5B-Instruct（Aphrodite 引擎，小显存冒烟测试用）
# 定位：qwen2.5-1.5b 家族在 Aphrodite（vLLM 分支）上的基线，与 llamacpp/qwen2.5-1.5b.yaml
#       同参数口径（tp=1、ctx 8192、无量化加速），用于跨引擎横向对比与功能链路验证。
# 平台限制：aphrodite 属托管引擎（MANAGED_ENGINES），venv 仅 Linux 可建 —— Windows 开发机
#       上 check_requirements 会直接报 EngineEnvError，本文件需在有 .venvs/aphrodite 的部署机上使用。
# 显存估算：BF16 权重约 3.09GB + KV（8192 ctx ≈ 120MB）+ 激活；Aphrodite 默认按 vLLM
#       口径预分配 90% 显存，6GB 单卡可容纳但余量有限。
group: qwen2.5-1.5b
# 注意：不写 alias（家族短名 qwen2.5-1.5b 已被 llamacpp 成员占用；写与 name 同名的
# alias 会触发 ProfileError 导致整条被 list_profiles 跳过）。name 自动推导为 qwen2.5-1.5b-aphrodite。
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）；8140 已被同引擎 qwen3.8 占用
port: 8141
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

aphrodite:
  # model：HuggingFace 模型 ID（check_requirements 要求必填；pre_start 在本地目录
  # 不存在时按 download 段下载并改写为 $MODEL_ROOT 下的落地路径）
  model: Qwen/Qwen2.5-1.5B-Instruct
  # download：ModelScope HF 格式仓库（官方仓库，BF16 全量约 3.09GB）
  download:
    modelscope_id: Qwen/Qwen2.5-1.5B-Instruct
  # tensor_parallel_size：单卡机器必须为 1
  tensor_parallel_size: 1
  # quantization：留空 = BF16 原精度。现有 qwen3.8 的 "gguf" 是给 GGUF 文件用的，
  # 本条走 HF 权重不需要
  quantization: ""
  # max_model_len：与家族其他成员对齐压到 8192（模型原生支持 32K，小卡没必要开满）
  max_model_len: 8192
  # extra_args：透传给 `aphrodite run` 的额外参数
  extra_args: "--disable-log-requests"

usage:
  # price_in / price_out：每千 token 计价（元），供 cc-switch 用量统计
  price_in: 0.5
  price_out: 1.0
