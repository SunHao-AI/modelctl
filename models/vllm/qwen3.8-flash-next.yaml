# vllm/qwen3.8-flash-next.yaml —— Qwen3.8-Flash-Next（vLLM 引擎，HuggingFace 原始权重，FP8）
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持 TEP（Tensor + Expert Parallel）与 FP8 量化，适合高吞吐在线服务。
# 模型背景（2026-08-26 阿里 Qwen 开源，Qwen4 架构早期预览）：
#   - 多模态 MoE，125B 总参 + 51B N-gram Embedding，每 token 激活 6B
#   - 混合注意力：GDN（Gated DeltaNet 36 层）+ QSA（Qwen Sparse Attention 12 层）
#   - 残差分支 ×4 + N-gram 查表（可卸载至 Host Memory）
#   - 格式：FP8 172.78 GiB / BF16 335.28 GiB；原生 262144 token 上下文
#
# 【支持 Docker 方式走 modelctl 启动】
#   vllm.docker_image: vllm/vllm-openai:qwen38-flash-next（仅本模型的官方 Day-0 镜像，PyPI 不支持该模型）
# 生命周期：
#   1. 首次启动前 docker 自动 pull 该镜像（约 21.8GB）
#   2. 模型按 download 段从 ModelScope 拉到 $MODEL_ROOT（默认 /raid5/sh/model-hf），
#      modelctl 写回 yaml `model:` 字段为本地绝对路径（之后的启动不再重复下载）
#   3. 容器使用 nvidia-container-toolkit + --gpus JSON 透传 yaml gpu_list 指定的同卡
#   4. 容器内 vLLM 绑定 8000，宿主端口 = yaml 顶层 `port`
#   5. modelctl stop 通过 start_detached PID → fuser → pkill 三层 stop 容器
#
# 【硬件真实（8×RTX 5880 Ada，本配置已验证）】
#   - 8×NVIDIA RTX 5880 Ada，单卡 49,140 MiB ≈ 48GB（非 80G），CC 8.9，**支持 FP8**
#   - 总显存 ≈ 384GB。FP8 权重 172.78GB 占 ~45%，余 ~211GB 给 KV/激活/元数据
#   - A6000 (Ampere CC 8.6) 不支持 FP8，本配置不适用 A6000 服务器
#
# 【FP8 量化块约束】（影响 TP 选型）
#   官方 FP8 检查点的 weight_block_size 是 [128, 128]（128 宽块）。
#   plain TP8 切到 8 卡后，gate/up 的 output_size 出现 80（非 128 倍数） → ValueError。
#   所以 8 卡必须用 **TEP8 = TP8 + --enable-expert-parallel --moe-backend triton**，
#   MoE 后端走 triton 时每条 expert 独立量化，绕开 TP 整除约束。
#   4 卡场景用 TP4（128 × 8 / 4 = 256，能整除，不需要 expert parallel）。
#
# 官方 recipe（recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next）：
#   - GB300 4 卡：FP8 最低 TP2、推荐 TP4
#   - H200 8 卡：FP8 必须 TEP8（plain TP8 与 128 宽量化块不兼容），triton MoE 后端
#   - 本配置 = 按 H200 8 卡官方值 1:1 移植到 8×RTX 5880，仅 --moe-backend triton 保留（Ada 也支持）
group: qwen3.8-flash-next
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8110
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/不存在时通过 download 段从 ModelScope 下载并写回本地路径
  model: Qwen/Qwen3.8-Flash-Next-FP8
  # docker_image：Day-0 vLLM 专用镜像
  #   - 仅此一个镜像支持本模型；`vllm serve` 在 PyPI vLLM 0.27/0.28 上跑不通本架构
  #   - 镜像内含 Qwen4ExpForConditionalGeneration 注册、QSA attention kernel、FlashQLA 等
  docker_image: vllm/vllm-openai:qwen38-flash-next
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式，FP8 块量化）
    modelscope_id: Qwen/Qwen3.8-Flash-Next-FP8
  # tensor_parallel_size：张量并行 GPU 数
  # 本配置 8 卡 → tensor_parallel_size = 8（必须配合下方 --enable-expert-parallel）
  tensor_parallel_size: 8
  # gpu_list：物理 GPU 编号；长度必须等于 tensor_parallel_size
  gpu_list: "0,1,2,3,4,5,6,7"
  # max_model_len：最大上下文长度（token），原生 262144
  # ★ 8 卡 RTX 5880 当前实测：262144 启动失败（Available KV cache memory: -1.6 GiB）
  #   原因：262144 × 256 seq × 60 layer 全月估算 > 实际显存余量
  #   降档阶梯：131072（首推） → 65536（多 agent 并发） → 32768（短问答）
  # 改完此字段必须 modelctl stop + start 重新走 init_engine_core
  max_model_len: 131072
  # gpu_memory_utilization：显存利用率上限（0~1）
  # 8 卡 RTX 5880: 设 0.85（比 0.9 紧一点防 JIT/kernel 编译瞬时爆，比 0.80 松一点保 KV）
  gpu_memory_utilization: 0.85
  # quantization：量化方式（FP8 块级）
  # 硬件要求：CC ≥ 8.9（A6000=8.6 不支持，本配置不用于 A6000）
  # 切换 BF16：删掉本字段，并把 model/modelscope_id 改回 Qwen/Qwen3.8-Flash-Next（335.28GiB，5880 装不下）
  quantization: fp8
  # 【硬约束】不要设置 kv_cache_dtype: fp8
  # Qwen4Exp 的 QSA（12 层）在 vLLM Day-0 镜像里硬校验：
  #   NotImplementedError: Qwen3.8-Flash-Next QSA requires a BF16 main KV cache
  # 必须留默认 BF16。等 vLLM 后续版本把 QSA FP8 路径跑了再恢复。
  # kv_cache_dtype: fp8
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，由 shlex 拆分）
  # 【本配置 = H200 8 卡官方 recipe 1:1（triton MoE 后端在 Ada 上也支持）】
  #   --enable-expert-parallel         TEP8 必须项（plain TP8 与 128 宽量化块不兼容）
  #   --moe-backend triton             MoE kernel 走 triton（官方 8 卡 H200 推荐，RTX 5880 兼容）
  #   --max-num-seqs 256               官方默认值（4 卡 GB300 同值，本配置 8 卡按相同配方）
  #   --max-num-batched-tokens 8192    官方甜点位
  #   --enable-prefix-caching          多 agent 缓存
  #   --no-enable-flashinfer-autotune  官方全程保留
  #   --enable-auto-tool-choice        工具调用（OpenAI 兼容函数调用）
  #   --tool-call-parser qwen3_xml     官方推荐（注意是 qwen3_xml，部分中文转载误标 qwen3_coder）
  #   --reasoning-parser qwen3         混合思考模型的 reasoning_content 拆分
  extra_args: "--enable-expert-parallel --moe-backend triton --max-num-seqs 256 --max-num-batched-tokens 8192 --enable-prefix-caching --no-enable-flashinfer-autotune --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3"

usage:
  # price_in / price_out：每千 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  price_out: 3.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
