# vllm/qwen3.8-flash-next.yaml —— Qwen3.8-Flash-Next（vLLM 引擎，HuggingFace 原始权重，FP8）
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持 TEP（Tensor + Expert Parallel）与 FP8 量化，适合高吞吐在线服务。
# 模型背景（2026-08-26 阿里 Qwen 开源，Qwen4 架构早期预览）：
#   - 多模态 MoE，125B 总参 + 51B N-gram Embedding，每 token 激活 6B
#   - 混合注意力：GDN（Gated DeltaNet 36 层）+ QSA（Qwen Sparse Attention 12 层）
#   - 残差分支 ×4 + N-gram 查表（可卸载至 Host Memory）
#   - 格式：FP8 172.78 GiB / BF16 335.28 GiB；原生 262144 token 上下文
#
# 【支持 Docker 方式走 modelctl 启动】
#   vllm.docker_image: vllm/vllm-openai:qwen38-flash-next（仅本模型的官方 Day-0 镜像，PyPI 不支持该模型）
# 生命周期：
#   1. 首次启动前 docker 自动 pull 该镜像（约 21.8GB）
#   2. 模型按 download 段从 ModelScope 拉到 $MODEL_ROOT/<仓库名>；落地路径由
#      MODEL_ROOT + modelscope_id 确定性推导，目录已存在即复用（yaml 不会被改写）
#   3. 容器使用 nvidia-container-toolkit + --gpus JSON 透传 yaml gpu_list 指定的同卡
#   4. 容器内 vLLM 绑定 8000，宿主端口 = yaml 顶层 `port`；docker 路径不写 PID 文件
#   5. modelctl stop 走 stop_docker_instance——docker rm -f + 清本地 PID（容器路径本身不写
#      PID，PID 仅 venv 路径写；环境切换残留由同一把防御性清理兜住）
#
# 【硬件真实（8×RTX 5880 Ada，本配置已验证）】
#   - 8×NVIDIA RTX 5880 Ada，单卡 49,140 MiB ≈ 48GB（非 80G），CC 8.9，**支持 FP8**
#   - 总显存 ≈ 384GB。FP8 权重 172.78GB 占 ~45%，余 ~211GB 给 KV/激活/元数据
#   - A6000 (Ampere CC 8.6) 不支持 FP8，本配置不适用 A6000 服务器
#
# 【FP8 量化块约束】（影响 TP 选型）
#   官方 FP8 检查点的 weight_block_size 是 [128, 128]（128 宽块）。
#   plain TP8 切到 8 卡后，gate/up 的 output_size 出现 80（非 128 倍数） → ValueError。
#   所以 8 卡必须用 **TEP8 = TP8 + --enable-expert-parallel --moe-backend triton**，
#   MoE 后端走 triton 时每条 expert 独立量化，绕开 TP 整除约束。
#   4 卡场景用 TP4（128 × 8 / 4 = 256，能整除，不需要 expert parallel）。
#
# 官方 recipe（recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next）：
#   - GB300 4 卡：FP8 最低 TP2、推荐 TP4
#   - H200 8 卡：FP8 必须 TEP8（plain TP8 与 128 宽量化块不兼容），triton MoE 后端
#   - 本配置 = 按 H200 8 卡官方值 1:1 移植到 8×RTX 5880，仅 --moe-backend triton 保留（Ada 也支持）
group: qwen3.8-flash-next
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8110
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/本地路径不存在时，按 download 段下载到 $MODEL_ROOT/<仓库名> 后直接使用；
  # 落地路径由 MODEL_ROOT + modelscope_id 确定，本文件不会被改写（保持 git 干净）
  model: Qwen/Qwen3.8-Flash-Next-FP8
  # docker_image：Day-0 vLLM 专用镜像
  #   - 仅此一个镜像支持本模型；`vllm serve` 在 PyPI vLLM 0.27/0.28 上跑不通本架构
  #   - 镜像内含 Qwen4ExpForConditionalGeneration 注册、QSA attention kernel、FlashQLA 等
  docker_image: vllm/vllm-openai:qwen38-flash-next
  # bind_host：服务绑定地址（安全加固，2026-09-08）
  # 默认 127.0.0.1 仅回环监听：外部（含 AI Agent / 其他内网主机）无法直连引擎端口，
  # 从而堵住绕过网关（5003）鉴权/账号/多 Key/token 限速/审计的"第二入口"。
  # 确需对外暴露时改为 0.0.0.0，并配合防火墙/白名单限制来源（非默认，风险自担）。
  bind_host: 127.0.0.1
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式，FP8 块量化）
    modelscope_id: Qwen/Qwen3.8-Flash-Next-FP8
  # tensor_parallel_size：张量并行 GPU 数
  # 本配置 8 卡 → tensor_parallel_size = 8（必须配合下方 --enable-expert-parallel）
  tensor_parallel_size: 8
  # gpu_list：物理 GPU 编号；长度必须等于 tensor_parallel_size
  gpu_list: "0,1,2,3,4,5,6,7"
  # max_model_len：最大上下文长度（token），原生 262144
  # ★ 8 卡 RTX 5880 实测（含 MTP，且 PLE CPU offload 已生效）：单卡可用 KV 25.57 GiB，
  #   GPU KV cache size 1,890,319 tokens，262144 全上下文下并发 7.21x（余量充裕）。
  #   对比：未开 PLE 时每卡可用 KV 仅 2.54~3.69 GiB，才逼得降档到 131072。
  #   降档阶梯（宿主内存/显存吃紧时）：262144（当前） → 131072 → 65536（多 agent 并发） → 32768（短问答）
  # 改完此字段必须 modelctl stop + start 重新走 init_engine_core
  max_model_len: 262144
  # gpu_memory_utilization：显存利用率上限（0~1）
  # ★ 8 卡 RTX 5880 实测（单卡可用 47.37 GiB，PLE CPU offload 已生效）：
  #   0.97 → KV cache 被"按预算贪心分满"（25.57 GiB），紧接着 FULL CUDA Graph 捕获
  #          只需再挤 ~50 MiB 却仅剩 38 MiB → OOM，EngineCore 崩：
  #          `Capturing CUDA graphs (FULL): 0%| 0/26` 即挂，报 Engine core initialization failed。
  #   0.92 → 释放约 2.37 GiB/卡，可稳定启动，但推理阶段 prefill 瞬时激活仍压穿
  #          （2026-09-11 `_short_conv_dilated_prefill_batched` → `F.silu` 报 OOM）。
  #   0.88（当前值）→ 释放 ~5.67 GiB/卡，覆盖 prefill 峰值激活 + PYTORCH_CUDA_ALLOC_CONF
  #          expandable_segments 缓解碎片，实测可稳定运行。
  #   ⚠ 关键：KV cache 是按预算**贪心分满**的，所以利用率不能贴着上限给——必须给
  #     profiling / CUDA Graph 捕获 / 推理峰值激活留固定余量；这是本字段的职责，降 max_model_len 无效。
  #   ⚠ 若仍告警 JIT/激活瞬时 OOM，优先减 max_num_batched_tokens（如 7168→6144→4096）而非回退 len。
  gpu_memory_utilization: 0.88
  # quantization：量化方式（FP8 块级）
  # 硬件要求：CC ≥ 8.9（A6000=8.6 不支持，本配置不用于 A6000）
  # 切换 BF16：删掉本字段，并把 model/modelscope_id 改回 Qwen/Qwen3.8-Flash-Next（335.28GiB，5880 装不下）
  quantization: fp8
  # 【硬约束】不要设置 kv_cache_dtype: fp8
  # Qwen4Exp 的 QSA（12 层）在 vLLM Day-0 镜像里硬校验：
  #   NotImplementedError: Qwen3.8-Flash-Next QSA requires a BF16 main KV cache
  # 必须留默认 BF16。等 vLLM 后续版本把 QSA FP8 路径跑了再恢复。
  # kv_cache_dtype: fp8
  # 【硬约束】不要加 --kv-transfer-config（MooncakeStoreConnector / KV Offload）
  # recipes.vllm.ai 的本模型页面有 "KV Offload → Mooncake (Distributed)" 选项，
  # 那是给 2+ 实例 + RDMA + TB 级 DRAM 的集群用的**可选**配方；官方三条推荐命令
  # （4×GB300 / 8×H200 / 4×H100）里均未启用。本环境四条独立否决理由：
  #   1) 架构阻断：36 层 GDN + 12 层 QSA 属混合注意力，vLLM KV connector 尚不支持
  #      GDN state 传输（MooncakeConnector 取首层 backend → GDNAttentionBackend 被
  #      塞进 is_mamba=False 的 TransferTopology 即崩；NIXL 则报
  #      "3-read conv transfer only supports Mamba2 models, got mamba_type='gdn_attention'"）。
  #   2) 无物可共享：Mooncake 的池子装的是 prefix cache 命中的 KV block。本仓在 qwen3.8 上
  #      实测混合模型 align mode 命中率 70~73%（见 known-pitfalls/backend/vllm-kv-cache-metrics.md），
  #      但那是**单实例 GPU 内**命中；跨实例共享还要求 QSA 那 12 层的 block 能被 connector
  #      序列化，而第 1) 条已说明 connector 连 backend 都取不对。
  #   3) 内存不足：global_segment_size 是 **per GPU**，官方值 100GB/rank；本机系统内存仅
  #      128GB（见 docs/rtx5880-optimization-guide.md），8 rank 连 8GB/rank 都勉强。
  #   4) 无 RDMA + 单机：只有 protocol=tcp 可走，PCIe 4.0 无 NVLink 下搬运 KV 未必快过
  #      重算 prefill；且 Mooncake 的卖点是跨实例共享池，本部署是每 profile 单实例。
  # 结论：PD 分离（MooncakeConnector + MultiConnector）同样排除，理由同上。
  # 详见 docs/known-pitfalls/backend/vllm-kv-offload-connector-support.md。
  # kv_transfer_config: '{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both"}'
  # docker_env：透传进容器内部的环境变量（`docker run -e`）。
  # ⚠ build_command 返回的 env 只进 docker CLI 宿主进程，进不了容器——容器内变量必须走这里。
  # 【VLLM_PLE_CPU_OFFLOAD=1】把 51B N-gram Embedding（PLE）查表内存卸载到 host RAM 并异步预取。
  #   这是**权重表卸载**，与上面的 KV connector 是两回事，因此不受 GDN 限制。
  #   官方定位：TP/TEP 在 80GB 级及以下卡上是"必须项"（embedding 表本身就超出每卡余量），
  #   H200 以上才"可选"。本配置 48GB/卡属于必须侧——未开启时每卡可用 KV 仅 3.69 GiB，
  #   开启后 25.57 GiB，`max_model_len` 得以从 131072 推回原生 262144。
  #   ⚠ 前置：宿主需 ≥51GB + 运行时余量（实测本机 256GB，Available RAM 230.14 GiB，充裕）；
  #     若宿主内存告急或出现预取导致的吞吐下降，删掉本项回退。
  #   实测装载日志：`Found 1 PleOffloadLayer(s): [...ple_embedding]` →
  #     `matched 132 checkpoint tensor(s), loaded 5 offload entries`（表落 host RAM，不占显存）。
  docker_env:
    VLLM_PLE_CPU_OFFLOAD: "1"
    # PYTORCH_CUDA_ALLOC_CONF：让 PyTorch 缓存分配器使用可扩展分段，缓解 VRAM 碎片。
    # OOM 日志（2026-09-11）建议：reserved but unallocated 161 MiB + 分配 140 Mi 失败 →
    # expandable_segments 可让已 reserve 但 unalloc 的块重新增长而避免碎片化。
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，由 shlex 拆分）
  # 【本配置 = H200 8 卡官方 recipe 1:1（triton MoE 后端在 Ada 上也支持）】
  #   --enable-expert-parallel         TEP8 必须项（plain TP8 与 128 宽量化块不兼容）
  #   --moe-backend triton             MoE kernel 走 triton（官方 8 卡 H200 推荐，RTX 5880 兼容）
  #   --max-num-seqs 64                并发序列上限（官方 4 卡 GB300 用 256；本配置 8 卡显存更紧，降到 64）
  #   --max-num-batched-tokens 7168    单步批 token 上限（当前采用 7168）
  #     vLLM 会将该值向上取整到 token_block_size(16) 的倍数，建议用 16 倍数。
  #     调小→显著降低峰值激活显存（warmup/前向瞬时 OOM 时优先调它，而非回退 len）；
  #     调大→吞吐更高，但显存峰值更高。低并发(≤64)下多数请求未触顶，性能基本无感。
  #     需降显存时的可选档位（16 的倍数）：4096 → 5120 → 6144 → 7168 → 8192
  #       折中推荐 6144：吞吐损失小，显存峰值比 8192 低约 25%。
  #   --enable-prefix-caching          多 agent 缓存
  #   --no-enable-flashinfer-autotune  官方全程保留
  #   --enable-auto-tool-choice        工具调用（OpenAI 兼容函数调用）
  #   --tool-call-parser qwen3_coder    官方 recipe 采用（Qwen3-Coder XML 格式 <function=/<parameter=>）；
  #      与 qwen3.8.yaml 相同。vLLM 也有 qwen3_xml（同格式的不同实现，流式解析较新且含 bug），统一用 qwen3_coder。
  #   --reasoning-parser qwen3         混合思考模型的 reasoning_content 拆分
  # 【MTP 投机解码（启用）】——按 repo 已验证写法（同 qwen3.8.yaml）
  #   --speculative-config '{"method":"mtp","num_speculative_tokens":2}'：模型自带 MTP 头，无需 draft。
  #   目标层数=2（官方推荐 3~5 接受率最高；此处按需求设为 2）。
  #   ⚠ 依赖 vLLM ≥0.9.x MTP 完整支持 + Day-0 镜像已注册 MTP 头；MTP 头/草稿 KV 额外占显存，
  #     本配置 8×RTX 5880 的 gpu_memory_utilization 为 0.88，若启动 OOM 优先降 --max-num-seqs，
  #     或从 extra_args 删除 "--speculative-config ..." 回退。
  extra_args: '--enable-expert-parallel --moe-backend triton --max-num-seqs 64 --max-num-batched-tokens 7168 --enable-prefix-caching --no-enable-flashinfer-autotune --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --speculative-config ''{"method":"mtp","num_speculative_tokens":2}'''

usage:
  # price_in / price_out：每千 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  price_out: 3.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
