# vllm/qwen3.8-light.yaml —— Qwen3.8-27B（vLLM 引擎，HuggingFace 原始权重，轻量上下文）
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持张量并行与 FP8 量化，适合高吞吐在线服务。
# 附录 B.1：多模型 GPU 隔离 —— 与 deepseek-v4-flash-vllm-light（gpu 0-3）互补，占用 gpu 4-7。
group: qwen3.8
# alias：服务显示别名
alias: qwen3.8-vllm-l
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8105
# variant：变体标识（light/high/pp 等），影响自动推导的 name 与 group
variant: light
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/本地路径不存在时，按 download 段下载到 $MODEL_ROOT/<仓库名> 后直接使用（本文件不会被改写）
  model: Qwen/Qwen3.8-27B
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式）
    modelscope_id: Qwen/Qwen3.8-27B
  # tensor_parallel_size：张量并行 GPU 数（不得超过实际 GPU 数）
  tensor_parallel_size: 4
  # max_model_len：最大上下文长度（token）
  # 注意：单序列完整可用（与并发无关）；KV 显存按 max_num_seqs × max_model_len 估算
  max_model_len: 16384
  # gpu_list：使用的 GPU 设备编号列表（与 deepseek-v4-flash-vllm-light 的 0-3 不重叠）
  gpu_list: "4,5,6,7"
  # gpu_memory_utilization：显存利用率上限（0~1）
  gpu_memory_utilization: 0.92
  # quantization：量化方式（可选，如 fp8；FP8 需要 CC ≥ 8.9）
  quantization: ""
  # kv_cache_dtype：KV cache 数据类型（fp8 / fp16 / bf16；fp8 可节省一半 KV 显存，精度损失 <1%）
  kv_cache_dtype: fp8
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，按 shlex 拆分）
  # 官方 recipe 关键参数：reasoning 解析（非可选）+ 自动工具调用（与主配置一致）
  # MTP 投机解码（默认启用）：模型自带 MTP 头无需 draft，官方推荐 num=3
  extra_args: "--reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3}'"
  # ── 投机解码（可选，默认关闭）──
  # 支持方法：MTP（模型自带 MTP 头，无需 draft）；EAGLE3/dspark 不适用（无对应草稿模型）
  # 最佳参数：num_speculative_tokens=3（官方 recipe 推荐值），与主配置 qwen3.8-vllm 一致
  # 完整命令行：
  #   extra_args: "--reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3}'"
  # 参考：recipes.vllm.ai 官方 recipe；vLLM MTP 文档（docs.vllm.ai 搜索 "MTP"）

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 0.5
  # price_out：每千输出 token 计价（元）
  price_out: 1.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
