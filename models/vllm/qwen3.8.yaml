# vllm/qwen3.8.yaml —— Qwen3.8-27B（vLLM 引擎，HuggingFace 原始权重）
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持张量并行与 FP8 量化，适合高吞吐在线服务。
# 官方 recipe（recipes.vllm.ai）：混合注意力模型（16/64 全注意力 + 48 线性注意力 + MTP 头），
# chat 模板以 <think> 开头，必须启用 --reasoning-parser qwen3，否则推理块会进入 content。
#
# 【FP8 检查点切换说明】（官方 recipe 推荐）
# 官方 FP8 检查点 Qwen/Qwen3.8-27B-FP8（block-scaled，约 28.7GiB，单卡可装）可降低约 50% 权重显存：
#   vllm:
#     model: Qwen/Qwen3.8-27B-FP8
#     download:
#       modelscope_id: Qwen/Qwen3.8-27B-FP8
#     quantization: fp8
# 切换前请确认仓库存在（modelctl start 会自动下载，仓库不存在会失败）；
# 回退：model/modelscope_id 改回 Qwen/Qwen3.8-27B 并清空 quantization 即可恢复 BF16。
group: qwen3.8
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8101
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/不存在时通过 download 段从 ModelScope 下载并写回本地路径
  model: Qwen/Qwen3.8-27B
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式）
    modelscope_id: Qwen/Qwen3.8-27B
  # tensor_parallel_size：张量并行 GPU 数（不得超过实际 GPU 数）
  tensor_parallel_size: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；配置后长度必须等于 tensor_parallel_size
  # 示例：gpu_list: "0,1,2,3"
  # max_model_len：最大上下文长度（token）
  # 注意：单序列完整可用（与并发无关）；KV 显存按 max_num_seqs × max_model_len 估算
  max_model_len: 262144
  # gpu_memory_utilization：显存利用率上限（0~1）
  # 注意：vLLM ≥0.21 默认启用 CUDA graph memory profiling，0.92 实际等效旧版的 0.8525；
  # 若想完全吃满显存，可在 extra_args 手动指定 --kv-cache-memory（见其注释，需按环境实测）
  gpu_memory_utilization: 0.92
  # quantization：量化方式（可选，如 fp8；FP8 需要 CC ≥ 8.9）
  # 默认 BF16；官方 FP8 检查点可用时改 quantization: fp8（见文件头注释）
  quantization: ""
  # kv_cache_dtype：KV cache 数据类型（fp8 / fp16 / bf16；fp8 可节省一半 KV 显存，精度损失 <1%）
  kv_cache_dtype: fp8
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，按 shlex 拆分）
  # 官方 recipe 关键参数：reasoning 解析（非可选）+ 自动工具调用；MTP 投机与 batch 调优待实测：
  #   --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
  #   --max-num-batched-tokens 8192 --max-num-seqs 256
  # --default-chat-template-kwargs '{"enable_thinking": false}'：服务端默认关闭思考
  #   （ModelScope 官方教程推荐）。Qwen3.5 家族模板强制 <think>，思考内容全部走
  #   reasoning 通道，Trae CN 等客户端不渲染会显示"无输出"；下沉到服务端后
  #   无论经网关还是直连 vLLM 都默认输出正文（请求显式传 chat_template_kwargs 仍可覆盖）。
  # --max-num-seqs 4：官方推荐并发上限，避免长上下文下显存/调度压力过大
  # --generation-config vllm：让客户端传入的 temperature/top_k/top_p 生效，
  #   不被模型自带 generation_config.json（Qwen3.8 为 temperature=1.0, top_k=20, top_p=0.95）覆盖
  # --kv-cache-memory=<字节数>：手动指定每卡 KV cache。设置后 vLLM 跳过显存 profiling，
  #   必须与当前机器/vLLM 版本实测匹配，否则 CUDA graph 捕获阶段 OOM（2026-08-25 TP=8
  #   新 vLLM 下 27990797312 即因此崩溃），故默认不启用——由上方 gpu_memory_utilization 自动分配
  extra_args: "--reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --generation-config vllm --default-chat-template-kwargs '{\"enable_thinking\": false}' --max-num-seqs 4"

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 0.5
  # price_out：每千输出 token 计价（元）
  price_out: 1.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
