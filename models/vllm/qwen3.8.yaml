# vllm/qwen3.8.yaml —— Qwen3.8-27B（vLLM 引擎，HuggingFace 原始权重）
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持张量并行与 FP8 量化，适合高吞吐在线服务。
# 官方 recipe（recipes.vllm.ai）：混合注意力模型（16/64 全注意力 + 48 线性注意力 + MTP 头），
# chat 模板以 <think> 开头，必须启用 --reasoning-parser qwen3，否则推理块会进入 content。
#
# 【量化：已采用 FP8】（官方 recipe 推荐，2026-09-03 由 BF16 切换）
# 官方 FP8 检查点 Qwen/Qwen3.8-27B-FP8（block-scaled，约 28.7GiB，单卡可装）相比 BF16 降低约 50% 权重显存：
#   每卡权重约 6.75 GB → 3.6 GB，8 卡合计释放 ~26 GB，转给 KV/激活，支撑更高并发/更稳长上下文。
# 硬件：RTX 5880 (CC 8.9) 支持 FP8；27B 为 dense 模型（无 MoE），TP8 直接可用，无需 expert parallel。
# 回退 BF16：model/modelscope_id 改回 Qwen/Qwen3.8-27B，并把 quantization 设为空字符串。
#
# 【KV cache 容量口径】（2026-09-04 实测：vLLM 0.27.1 + TP8 + FP8 权重 + FP8 KV）
#   启动日志：GPU KV cache size: 4,684,667 tokens / Maximum concurrency for 262,144 tokens: 17.87x
#   → attention block size 被引擎抬到 800 token（为让 attention page ≥ mamba/GDN page，
#     并把 mamba page padding 0.25% 使两者严格相等）；4,684,667 ÷ 800 ≈ 5,856 blocks，
#     每个 block = 1 页真 KV + 1 页等大的 GDN 状态页（这是池子 token 数偏小的主因）。
#   → 1% usage = 4,685 tokens，可据此把 metrics 行的百分比直接换算为驻留 token 数。
#   结论：`GPU KV cache usage` 长期 0~1.2% 属正常，不是故障——分母按 262k 满上下文预留
#     （可容 17.87 个全长序列），而 --max-num-seqs 8 使 usage 天花板只有 8/17.87 = 44.8%；
#     按实际观测到的 ~5.6 万 token 单请求上下文算，天花板仅 8×56k/4.68M ≈ 9.6%。
#     无需为此调高 gpu_memory_utilization：日志建议的 0.9583 只是补回 CUDA graph memory
#     profiling 扣掉的 0.0083 等效值（约 1% 池容量），在池子 90% 闲置时加上去纯属浪费。
group: qwen3.8
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8101
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/本地路径不存在时，按 download 段下载到 $MODEL_ROOT/<仓库名> 后直接使用；
  # 落地路径由 MODEL_ROOT + modelscope_id 确定，本文件不会被改写（保持 git 干净）
  model: Qwen/Qwen3.8-27B-FP8
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式）
    modelscope_id: Qwen/Qwen3.8-27B-FP8
  # tensor_parallel_size：张量并行 GPU 数（不得超过实际 GPU 数）
  tensor_parallel_size: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；配置后长度必须等于 tensor_parallel_size
  # 示例：gpu_list: "0,1,2,3"
  # max_model_len：最大上下文长度（token）
  # 注意：单序列完整可用（与并发无关）；KV 显存按 max_num_seqs × max_model_len 估算
  max_model_len: 262144
  # gpu_memory_utilization：显存利用率上限（0~1）
  # 注意：vLLM ≥0.21 默认启用 CUDA graph memory profiling，0.92 实际等效旧版的 0.8525；
  # 若想完全吃满显存，可在 extra_args 手动指定 --kv-cache-memory（见其注释，需按环境实测）
  gpu_memory_utilization: 0.95
  # quantization：量化方式（可选，如 fp8；FP8 需要 CC ≥ 8.9）
  # 当前采用 fp8（文件头注释：27B-FP8 权重省一半，RTX 5880 CC 8.9 支持）
  quantization: fp8
  # kv_cache_dtype：KV cache 数据类型（fp8 / fp16 / bf16；fp8 可节省一半 KV 显存，精度损失 <1%）
  kv_cache_dtype: fp8
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，按 shlex 拆分）
  # 官方 recipe 关键参数：reasoning 解析（非可选）+ 自动工具调用；MTP 投机与 batch 调优待实测（见下方注释）
  # --default-chat-template-kwargs '{"enable_thinking": false}'：服务端默认关闭思考
  #   （ModelScope 官方教程推荐）。Qwen3.5 家族模板强制 <think>，思考内容全部走
  #   reasoning 通道，Trae CN 等客户端不渲染会显示"无输出"；下沉到服务端后
  #   无论经网关还是直连 vLLM 都默认输出正文（请求显式传 chat_template_kwargs 仍可覆盖）。
  # --max-num-seqs 8：并发上限，避免长上下文下显存/调度压力过大。
  #   原为 4，但清洗客户端 --concurrency 64 时服务端恒定 Waiting:59，故上调到 8 提高吞吐；
  #   max_model_len=262144 下 KV 显存随 max_num_seqs 线性增长，再提升前务必确认显存余量，
  #   否则 CUDA graph 阶段易 OOM（参见下方 --kv-cache-memory 崩溃记录，2026-08-25）。
  #   （2026-09-03 已切 FP8，释放每卡 ~3.6GB 权重余量；若确需更高吞吐，可从 8 起步实测上调：
  #      8 → 16 → 32，每档都需 modelctl stop + start 重新走 init_engine_core，遇 OOM 即回退）
  #   2026-09-04 实测补充：池子容量 17.87×262144，usage 天花板 = max_num_seqs/17.87
  #     （8 → 44.8%，16 → 89.5%）。故 8→16 在 KV 显存上是安全的，"线性增长"不构成 16 的阻碍；
  #     真正的约束是 CUDA graph 捕获阶段的激活显存峰值，仍须逐档实测。
  # --generation-config vllm：让客户端传入的 temperature/top_k/top_p 生效，
  #   不被模型自带 generation_config.json（Qwen3.8 为 temperature=1.0, top_k=20, top_p=0.95）覆盖
  # --kv-cache-memory=<字节数>：手动指定每卡 KV cache。设置后 vLLM 跳过显存 profiling，
  #   必须与当前机器/vLLM 版本实测匹配，否则 CUDA graph 捕获阶段 OOM（2026-08-25 TP=8
  #   新 vLLM 下 27990797312 即因此崩溃），故默认不启用——由上方 gpu_memory_utilization 自动分配
  # --enable-prefix-caching（2026-09-04 验证通过，默认启用）
  #   背景：不传该参数时，引擎 config 行为 `enable_prefix_caching=False` 且该键**不在**
  #     api_utils.py 打印的 non-default args 里（我们只传 18 个参数）→ vLLM 0.27.1 在
  #     config 后处理阶段按混合注意力架构**静默改写**了默认值（无任何告警）。开启后：
  #   收益：实测 `Prefix cache hit rate` 0.0% → 12% → 27% → 42% → 58% → 70~73% 单调爬升；
  #     agent/IDE 逐轮重发递增上下文的负载下，prompt throughput 峰值由 5,096 降至
  #     163~1,733 tokens/s（每轮只 prefill 未命中增量）。
  #   代价：引擎自动把 Mamba/GDN 循环状态切到 `cache mode='align'`（按 800-token 块对齐快照，
  #     官方标注 experimental）；KV 池 4,684,667 → 4,643,693 tokens（-0.87%，`Add 3 padding
  #     layers` 的最坏 6.25% 实际未出现）；usage 峰值 1.2% → 4.2%（状态页按块驻留，多请求
  #     时上限变低，但池子极空闲，无影响）。GC：首次命中 GDN 块可能要带状态重算（实验未见异常），
  #     多轮 agent 会话下命中率持续上升，总体收益远大于此开销。
  #   验证（改参数后重启必查）：
  #     grep -o "enable_prefix_caching=[A-Za-z]*" data/logs/launch-qwen3.8-vllm.log | head -1
  #     grep -o "Prefix cache hit rate: [0-9.]*%" data/logs/launch-qwen3.8-vllm.log | tail -5
  #   回退：从本行删除 ` --enable-prefix-caching` 并 stop + start（若命中率长期 <10% 说明
  #     vLLM 升级后 Mamba 路径有变，删掉即可，收益消失不会反噬）。
  extra_args: '--reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --generation-config vllm --default-chat-template-kwargs ''{"enable_thinking": false}'' --max-num-seqs 64 --max-num-batched-tokens 7168  --enable-prefix-caching --speculative-config ''{"method":"mtp","num_speculative_tokens":3}'''
  # ── 投机解码（默认启用）──
  # 已启用：MTP，模型自带 MTP 头无需 draft；官方推荐 num=3
  # 配置项：num_speculative_tokens=3（官方 recipe 推荐值，3~5 接受率最高，>5 收益递减）
  # 权衡：需 vLLM ≥ 0.9.x MTP 完整支持；MTP 头固定 ~270MB/TP8 张量切片，长上下文下 draft KV 额外占显存；
  #   接受率为负（未命中纯浪费 compute）时建议 --max-num-seqs 调低或移除 --speculative-config 回退
  # 回退方式：从 extra_args 删除 --speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3}' 即可
  # 参考：recipes.vllm.ai 官方 recipe；vLLM MTP 文档（docs.vllm.ai 搜索 "MTP"）
  # batch 调优（可选，与 MTP 正交）：--max-num-batched-tokens 8192 --max-num-seqs 256
  #   注：上值仅为官方上限参考，当前实际 --max-num-seqs 8（见上方注释），--max-num-batched-tokens 走默认 8192。
  # 请求级审计（网关侧记录每请求 TTFT/tps；见 .env 的 AUDIT_* 与 README「请求级审计」）
  enable_per_request_metrics: true
  # 保证流式末块回传 usage（否则网关侧走 collector 差分估算 token 数）
  enable_force_include_usage: true

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 0.5
  # price_out：每千输出 token 计价（元）
  price_out: 1.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
