# vllm/deepseek-v4-flash.yaml —— DeepSeek-V4-Flash-Vision-Exp（vLLM 引擎，HuggingFace 原始权重）
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持张量并行与 FP8 量化，适合高吞吐在线服务。
# 官方 recipe（recipes.vllm.ai）：DeepSeek 首个多模态 V4 —— V4-Flash 语言骨干（284B/13B MoE，
# CSA+HCA 混合注意力）+ 32 层视觉塔（~0.5B），FP4+FP8 混合权重（vision tower 为 BF16），
# 约 168GB/48 分片，自带 DSpark 投机模块；官方 1M 上下文实测仅 32K。
# 注意：vision 支持尚未进稳定 vLLM（PR #54566），必须用 pinned 镜像 vllm/vllm-openai:deepseekv4-flash-vision，
# NVIDIA 专属（ROCm/XPU 无 vision 实现）。

group: deepseek-v4-flash
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8100
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/本地路径不存在时，按 download 段下载到 $MODEL_ROOT/<仓库名> 后直接使用（本文件不会被改写）
  # bind_host：服务绑定地址（安全加固，2026-09-08，所有引擎统一默认）
  # 默认 127.0.0.1 仅回环监听：外部（含 AI Agent / 其他内网主机）无法直连引擎端口，
  # 从而堵住绕过网关鉴权/账号/多 Key/token 限速/审计的“第二入口”。
  # 确需对外暴露时改为 0.0.0.0，并配合防火墙/白名单限制来源（非默认，风险自担）。
  bind_host: 127.0.0.1
  model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  docker_image: vllm/vllm-openai:deepseekv4-flash-vision
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式）
    modelscope_id: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  # tensor_parallel_size：张量并行 GPU 数（不得超过实际 GPU 数）
  tensor_parallel_size: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；配置后长度必须等于 tensor_parallel_size
  # 示例：gpu_list: "0,1,2,3,4,5,6,7"
  # max_model_len：最大上下文长度（token）
  # 注意：单序列完整可用（与并发无关）；KV 显存按 max_num_seqs × max_model_len 估算
  # recipe 支持单节点 1M 上下文；Think Max 需 >=384K，默认 131K 已覆盖日常场景
  max_model_len: 131072
  # gpu_memory_utilization：显存利用率上限（0~1）
  gpu_memory_utilization: 0.92
  # quantization：量化方式（可选，如 fp8；FP8 需要 CC ≥ 8.9）
  # DeepSeek-V4 权重自带 fp8 量化（deepseek_v4_fp8），vLLM 会自动识别，此项留空即可
  quantization: ""
  # kv_cache_dtype：KV 缓存精度；DeepSeek-V4 的 fp8_ds_mla 布局强制要求 fp8（vLLM 0.27+ 断言）
  kv_cache_dtype: fp8
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，按 shlex 拆分）
  # 官方 recipe（GB200 NVL4 验证，vLLM 0.29+）：专家并行 + deepseek_v4 tokenizer/parser + DSpark 投机
  # 注意：vision recipe 推荐 num_speculative_tokens=3（0731 文本版为 7）；speculative-config 需
  # 显式带目标仓库名（DSpark 草稿融合在主 checkpoint 内，无独立 draft 仓库）
  extra_args: '--trust-remote-code --block-size 256 --enable-expert-parallel --tokenizer-mode deepseek_v4 --tool-call-parser deepseek_v4 --enable-auto-tool-choice --reasoning-parser deepseek_v4 --speculative-config ''{"method":"dspark","model":"deepseek-ai/DeepSeek-V4-Flash-Vision-Exp","num_speculative_tokens":3,"draft_sample_method":"probabilistic","enable_adaptive_verification":true}'''

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
