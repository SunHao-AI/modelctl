# vllm/kimi-k2.5.yaml —— Kimi-K2.5（1T/32B MoE，vLLM 引擎，HuggingFace 原始权重）
# ⚠️ 本机不可部署（8×RTX 5880 共 384GB 显存不足）：官方 recipe（recipes.vllm.ai）显示
# Kimi-K2.5 为 1T 参数 / 32B active 多模态 MoE，量化后最小 INT4 约 714GB、NVFP4 600GB、
# MXFP4 669GB，均超出本机 384GB；官方验证硬件为 8×H200（~640GB）。配置保留供未来硬件升级参考。
# 学习要点：vLLM 使用 HF 格式权重（非 GGUF），支持张量并行与 FP8 量化，适合高吞吐在线服务。
# 若未来硬件支持（如 8×H200 或 4×Blackwell），参考 recipe 参数：
#   --tool-call-parser kimi_k2 --enable-auto-tool-choice --reasoning-parser kimi_k2
#   --mm-encoder-tp-mode data --kv-cache-dtype fp8
#   --speculative-config '{"model":"lightseekorg/kimi-k2.5-eagle3-mla","method":"eagle3","num_speculative_tokens":3}'
group: kimi-k2.5
# port：服务监听端口（健康检查 http://127.0.0.1:<port>/health）
port: 8102
# api_key：OpenAI 兼容 API 密钥；${VAR} 会从环境变量/.env 插值
api_key: ${API_KEY}

vllm:
  # model：HuggingFace 模型 ID 或本地模型目录。
  # 为空/不存在时通过 download 段从 ModelScope 下载并写回本地路径。
  # 请替换为实际可用的 HF 模型 ID，如 moonshotai/Kimi-K2.5-Instruct
  model: moonshotai/Kimi-K2.5-Instruct
  # download：模型不存在时的自动下载配置（ModelScope，HF 格式仓库）
  download:
    # modelscope_id：ModelScope 仓库 ID（HF 格式）
    modelscope_id: moonshotai/Kimi-K2.5-Instruct
  # tensor_parallel_size：张量并行 GPU 数（不得超过实际 GPU 数）
  tensor_parallel_size: 8
  # gpu_list：指定使用的 GPU 设备编号（可选，默认不设=使用全部 GPU）；配置后长度必须等于 tensor_parallel_size
  # 示例：gpu_list: "0,1,2,3,4,5,6,7"
  # max_model_len：最大上下文长度（token）
  # 注意：单序列完整可用（与并发无关）；KV 显存按 max_num_seqs × max_model_len 估算
  max_model_len: 65536
  # gpu_memory_utilization：显存利用率上限（0~1）
  gpu_memory_utilization: 0.92
  # quantization：量化方式（可选，如 fp8；FP8 需要 CC ≥ 8.9，本机 Ada 架构满足）
  quantization: ""
  # kv_cache_dtype：KV cache 数据类型（fp8 / fp16 / bf16；fp8 可节省一半 KV 显存，精度损失 <1%）
  kv_cache_dtype: fp8
  # extra_args：透传给 `vllm serve` 的额外参数（空格分隔，按 shlex 拆分）
  # ── 投机解码（默认启用）──
  # 已启用：EAGLE3，官方 recipe 推荐；Kimi K2.5 无 MTP 头，必须走 EAGLE3 + draft 模型
  # 配置项：draft=lightseekorg/kimi-k2.5-eagle3-mla；num=3（官方推荐值）
  # 权衡：draft 模型额外显存（约数 GB）；首次启动自动下载 draft 权重（与主模型同 ModelScope 源）；
  #   需 vLLM ≥ 0.11.x EAGLE3 完整支持；接受率负时删除 --speculative-config 回退
  # 参考：recipes.vllm.ai 官方 recipe；vLLM EAGLE3 文档（docs.vllm.ai 搜索 "EAGLE3"）
  # ⚠️ 本机 384GB 显存不足 909GB 需求，启用本 profile 需先扩容到 8×H200 等硬件
  extra_args: "--speculative-config '{\"model\":\"lightseekorg/kimi-k2.5-eagle3-mla\",\"method\":\"eagle3\",\"num_speculative_tokens\":3}'"

usage:
  # price_in：每千输入 token 计价（元），供 cc-switch 用量统计
  price_in: 1.0
  # price_out：每千输出 token 计价（元）
  price_out: 2.0
  # budget：预算上限（元，可选）；设置后 cc-switch 显示剩余金额并支持百分比徽章（?view=tier）
  # budget: 50
