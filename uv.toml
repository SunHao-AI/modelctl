# PyPI index 优先级（uv 语义：先声明的 index 优先级最高，不是 default=true 最高）。
#
# ⚠ uv 的 `default = true` 含义与直觉相反：它把该 index 移到优先级列表**末尾**
# （最低优先级），作用是「替代 PyPI 作为兜底源」，而不是「设为主源」。
# 误用 default=true 会让解析流量全部落到 files.pythonhosted.org（跨境、易超时）。
#
# 因此这里按优先级从高到低显式声明，且**不要**给镜像加 default=true：
#   1. 清华源（同步最全、大 wheel 单连接最快）
#   2. 阿里云源（清华缺包时兜底）
#   3. 官方 PyPI（前两者都缺时兜底）
# uv 采用 first-match 策略：命中第一个含该包的 index 即停止，故顺序即优先级。
[[index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[[index]]
url = "https://pypi.org/simple/"

# 刻意不再声明 PyTorch 官方 cu130 index：
# - 它曾以 explicit = true 存在，但全仓库无 [tool.uv.sources] 引用，从未生效；
# - torch 的 CUDA 版本由 vllm 钉死的 torch 版本决定（vllm 0.27.1 → torch==2.13.0，
#   PyPI 默认 Linux wheel 已是 CUDA 13：cuda-toolkit 13.0 + nvidia-*-cu13）；
# - 且 download.pytorch.org 无国内镜像同步，指向它会把 526 MB 的 torch wheel
#   变成跨境下载，与本文件加速目标相悖。
# CUDA 构建的正确性改由启动前校验保证：compat_rules 的 torch_cuda_build 规则。
