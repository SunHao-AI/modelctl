# ================= modelctl Web UI 远程访问（独立端口 5001，根路径反代） =================
# 形态：与数据面 :5000（myflaskapp + LLM 路由）完全隔离的独立 server 块。
#       根路径整块给 Web UI ⇒ 前端零改动（axios baseURL '/admin/api'、/assets、
#       createWebHistory() 三处硬编码根路径全部保持原样）。
#       单中心入口：中心默认 208，换中心只改 upstream 一行。
#
# 与早先两版方案的关系
#   - 三端口版（8443/8444/8445）：需自签证书，已废弃；node1 上若还有 modelctl-webui.conf 请删。
#   - 复用 :5000 版：要么 server_name vhost（需域名），要么顶掉 myflaskapp 的 location /。
#   - 本版：新开 5001，明文 http，无证书、无域名、无前端改动。
#
# ── 部署步骤 ──────────────────────────────────────────────────────────────
#   1. 中心节点（默认 192.168.77.208）.env 放开绑定，然后重启：
#        WEBUI_HOST=0.0.0.0
#        modelctl webui restart
#      非中心节点（209/210）保持默认 127.0.0.1 即可，不对网可达。
#   2. 中心节点确认前端产物已构建（缺失则根路径 404，仅 /admin/api 可用）：
#        ls <项目根>/dist/index.html     # 没有就 modelctl webui restart 触发自动构建
#   3. 中心节点防火墙只放行 node1 访问 4173：
#        ufw allow from <node1内网IP> to any port 4173 proto tcp
#   4. node1 放行 5001 到公网（ufw 与云安全组都要开，漏一个就是连不上而非 403）：
#        ufw allow 5001/tcp
#   5. 上传本文件为 /etc/nginx/conf.d/modelctl-webui.conf → nginx -t && systemctl reload nginx
#
#   本文件无占位符，可直接通过 nginx -t（allow/deny 与端口按需调整即可）。
#
# ── 安全提醒（重要）────────────────────────────────────────────────────────
#   明文 HTTP 暴露公网 = 登录时的 API_KEY 在公文明文过网，可被中间网络设备抓取。
#   建议至少做一件事：
#     a) 下面 allow/deny 收紧到固定出口 IP（首选，取消注释并填真实 IP）；
#     b) 或改用 https（本文件末尾附最小改法）；
#     c) 或不开端口，改走 ssh -L 4173:127.0.0.1:4173 隧道。
#   另：SSE 走 ?key=<API_KEY> 传令牌，URL 会进日志，故 /admin/api/ 已 access_log off。

# ---------- http 块级：WebSocket 升级映射（集群 /admin/api/ws/cluster 用） ----------
# 若 nginx.conf 或 sites-enabled 下已定义 $connection_upgrade，删掉本 map，否则报 duplicate：
#   grep -rn connection_upgrade /etc/nginx/nginx.conf /etc/nginx/sites-enabled/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 中心节点：换中心只改这一行（208 → 209/210） ----------
upstream modelctl_center {
    server 192.168.77.208:4173;
    keepalive 32;
}

server {
    listen 5001;                       # 明文 http；要 TLS 见文件末尾
    server_name _;

    # 【建议收紧】命中客户端 IP（访问 5001 的来源），不是后端 192.168.77.x
    # allow 1.2.3.4;
    # deny  all;

    # 管理 API：SSE（/admin/api/tasks/{id}/stream、/admin/api/models/{n}/log/stream）
    #          + WebSocket（/admin/api/ws/cluster）都在这个前缀下
    location /admin/api/ {
        proxy_pass http://modelctl_center;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 逐块推送；缺省缓冲会让任务进度攒到最后一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        # 模型冷启动可达数百秒，默认 60s 会掐断长任务
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;                # 见上方安全提醒
    }

    # Vite 产物（与后端 dist/assets 目录名一致）
    location /assets/ {
        proxy_pass http://modelctl_center;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
    }

    # 前端 SPA。history 深链刷新由后端 SPA fallback 回 index.html，纯反代即可。
    # 后端对 v1/admin/docs 等前缀返回 404 JSON，不会把 API 请求误回成 HTML。
    location / {
        proxy_pass http://modelctl_center;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==================== 校验 ====================
# 先确认中心节点的 webui 活着（在 208 本机执行）：
#   curl -s http://127.0.0.1:4173/admin/api/health
# node1 上：
#   nginx -t && systemctl reload nginx
#   curl -s http://<node1内网IP>:5001/admin/api/health     # 期望 200（免鉴权）
# A 设备浏览器：
#   http://<node1公网IP>:5001/            → 填 208 节点 .env 的 API_KEY
#   刷新 http://<node1公网IP>:5001/models  # 深链不应 404
#   一键启停页进度应逐块推送（被缓冲=长时间无输出后一次性出现）
# 数据面无影响自检（本次未动 :5000）：
#   curl -sk https://<node1>:5000/208/llm/v1/models
#
# 排错速查
#   连不上（超时）  → 云安全组 / ufw 是否放行 5001；不是 nginx 的事
#   502            → 208 的 WEBUI_HOST 是否 0.0.0.0；208 防火墙是否放行 node1
#   404（根路径）   → 208 的 dist/ 未构建（/admin/api 仍可通即此症状）
#   403            → allow/deny 命中客户端 IP，外部访问必须显式 allow 其网段
#   静态资源 404    → /assets/ location 缺失，或 dist/assets 不存在
#   进度不逐块推送  → /admin/api/ 缺 proxy_buffering off
#   duplicate map   → $connection_upgrade 重复定义，删掉本文件的 map 块

# ==================== 附：后续改 HTTPS 的最小改法 ====================
