# ================= modelctl Web UI 远程访问（三端口，每节点一个入口） =================
# 形态：与数据面 :5000（myflaskapp + LLM 路由）完全隔离的三个独立 server 块。
#       每个端口把根路径整块交给一个节点的 Web UI ⇒ 前端零改动
#       （axios baseURL '/admin/api'、/assets、createWebHistory() 三处硬编码根路径保持原样）。
#
#   :5001 → 192.168.77.208:4173
#   :5002 → 192.168.77.209:4173
#   :5003 → 192.168.77.210:4173
#
# 为什么不做 /208/ 这种路径前缀（仿 :5000 的 /208/llm/）
#   数据面每条请求自带前缀，nginx 能逐请求分发；SPA 只有首个 HTML 请求带前缀，
#   之后 /assets/*、/admin/api/* 与路由改写后的地址栏全是根级路径，前缀第一跳即消失，
#   且前端 catch-all 路由会把 /208/ 重定向到 /login。硬做只有两条路，都不划算：
#     - Cookie 定桩（零代码）：同域 Cookie 不分标签页，同时开 208/209 会让 208 标签页
#       的轮询与启停按钮打到 209 —— 这是会真实停错模型的危险，不是显示错乱。
#     - 前端运行时识别前缀：要改 6 个前端文件（base + router base + axios + 3 处 SSE）。
#   独立端口没有串台风险、地址天然隔离，是三者中最稳的。
#
# ── 部署步骤 ──────────────────────────────────────────────────────────────
#   1. 三个节点的 .env 都放开绑定，然后重启（三个都要，与单中心方案不同）：
#        WEBUI_HOST=0.0.0.0
#        modelctl webui restart
#   2. 各节点确认前端产物已构建（缺失则根路径 404，仅 /admin/api 可用）：
#        ls <项目根>/dist/index.html     # 没有就 modelctl webui restart 触发自动构建
#   3. 各节点防火墙只放行 node1 访问 4173：
#        ufw allow from <node1内网IP> to any port 4173 proto tcp
#   4. node1 放行 5001-5003 到公网（ufw 与云安全组都要开，漏一个表现为连不上而非 403）：
#        ufw allow 5001:5003/tcp
#   5. 上传本文件为 /etc/nginx/conf.d/modelctl-webui.conf → nginx -t && systemctl reload nginx
#
#   本文件无占位符，可直接通过 nginx -t（allow/deny 与端口按需调整）。
#   旧版若是单端口 5001，直接覆盖即可；新增节点照抄一个 server 块改两处端口。
#
# ── 安全提醒（重要）────────────────────────────────────────────────────────
#   明文 HTTP 暴露公网 = 登录时的 API_KEY 在公文明文过网，可被中间网络设备抓取。
#   建议至少做一件事：
#     a) 下面 allow/deny 收紧到固定出口 IP（首选，取消注释并填真实 IP）；
#     b) 或改用 https（本文件末尾附最小改法）；
#     c) 或不开端口，改走 ssh -L 4173:127.0.0.1:4173 隧道。
#   另：SSE 走 ?key=<API_KEY> 传令牌，URL 会进日志，故 /admin/api/ 已 access_log off。

# ---------- http 块级：WebSocket 升级映射（集群 /admin/api/ws/cluster 用） ----------
# 若 nginx.conf 或 sites-enabled 下已定义 $connection_upgrade，删掉本 map，否则报 duplicate：
#   grep -rn connection_upgrade /etc/nginx/nginx.conf /etc/nginx/sites-enabled/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 三个 server 块内容完全一致，只差 listen 端口与 proxy_pass 目标 IP。
# 要调整 SSE/超时等参数时，务必三处同步改（或抽成 include /etc/nginx/snippets/*.conf）。

# ==================== 节点 208 ====================
server {
    listen 5001;                       # 明文 http；要 TLS 见文件末尾
    server_name _;

    # 【建议收紧】命中客户端 IP（访问本端口的来源），不是后端 192.168.77.x
    # allow 1.2.3.4;
    # deny  all;

    # 管理 API：SSE（/admin/api/tasks/{id}/stream、/admin/api/models/{n}/log/stream）
    #          + WebSocket（/admin/api/ws/cluster）都在这个前缀下
    location /admin/api/ {
        proxy_pass http://192.168.77.208:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 逐块推送；缺省缓冲会让任务进度攒到最后一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        # 模型冷启动可达数百秒，默认 60s 会掐断长任务
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;                # 见上方安全提醒
    }

    # Vite 产物（与后端 dist/assets 目录名一致）
    location /assets/ {
        proxy_pass http://192.168.77.208:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
    }

    # 前端 SPA。history 深链刷新由后端 SPA fallback 回 index.html，纯反代即可。
    # 后端对 v1/admin/docs 等前缀返回 404 JSON，不会把 API 请求误回成 HTML。
    location / {
        proxy_pass http://192.168.77.208:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

