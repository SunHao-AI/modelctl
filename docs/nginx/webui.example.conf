#   ssl_certificate     /etc/nginx/ssl/xxx.crt;      # grep -rn ssl_certificate /etc/nginx/sites-enabled/
#   ssl_certificate_key /etc/nginx/ssl/xxx.key;
# 自签必须带 SAN 且把三个端口地址都写进去，否则浏览器报 ERR_CERT_COMMON_NAME_INVALID：
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout /etc/nginx/ssl/modelctl.key -out /etc/nginx/ssl/modelctl.crt \
#     -subj "/CN=modelctl" -addext "subjectAltName=IP:<node1公网IP>"
