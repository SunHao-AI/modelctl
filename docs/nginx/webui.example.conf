# ==================== 校验 ====================
# 先在目标节点本机确认 webui 活着：
#   curl -s http://127.0.0.1:4173/admin/api/health
# node1 上：
#   nginx -t && systemctl reload nginx
#   for p in 5001 5002 5003; do curl -s -o /dev/null -w "$p %{http_code}\n" http://127.0.0.1:$p/admin/api/health; done
#   # 期望三行都是 200（该端点免鉴权）
# A 设备浏览器：
#   http://<node1公网IP>:5001/   → 填 208 节点 .env 的 API_KEY
#   http://<node1公网IP>:5002/   → 填 209 节点 .env 的 API_KEY
#   http://<node1公网IP>:5003/   → 填 210 节点 .env 的 API_KEY
#   深链：刷新 .../models 不应 404
#   SSE：一键启停页进度应逐块推送（被缓冲=长时间无输出后一次性出现）
# 登录态隔离提示：token 存 localStorage，按 origin（含端口）隔离，三入口互不干扰，
# 可放心并排开三个标签页各管一个节点——这正是三端口方案优于 Cookie 定桩的地方。
# 数据面无影响自检（本次未动 :5000）：
#   curl -sk https://<node1>:5000/208/llm/v1/models
#
# 排错速查
#   连不上（超时）  → 云安全组 / ufw 是否放行该端口；与 nginx 无关
#   502            → 该节点 WEBUI_HOST 是否 0.0.0.0；该节点防火墙是否放行 node1
#   404（根路径）   → 该节点 dist/ 未构建（/admin/api 仍可通即此症状）
#   403            → allow/deny 命中客户端 IP，外部访问必须显式 allow 其网段
#   静态资源 404    → /assets/ location 缺失，或 dist/assets 不存在
#   进度不逐块推送  → /admin/api/ 缺 proxy_buffering off
#   duplicate map   → $connection_upgrade 重复定义，删掉本文件的 map 块
#   端口被占        → ss -lntp | grep -E '500[123]'，先停掉占用者再 reload

# ==================== 附：后续改 HTTPS 的最小改法 ====================
# 每个 server 块两行改动 + 复用 myflaskapp 的证书（同机可共用）：
